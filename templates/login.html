<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Hopestone Payment Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a3a5c 0%, #2980b9 60%, #3a9fd8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-wrap {
      width: 100%;
      max-width: 420px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-circle {
      width: 68px; height: 68px;
      background: #fff;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .logo-circle span {
      font-size: 34px; font-weight: 900; color: #3a9fd8; line-height: 1;
    }
    .login-header h1 {
      color: #fff; font-size: 22px; font-weight: 800; margin-bottom: 4px;
    }
    .login-header p {
      color: rgba(255,255,255,0.72); font-size: 13.5px;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.18);
    }
    .alert {
      padding: 11px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 13.5px;
      border-left: 4px solid;
    }
    .alert-danger  { background: #fdf2f2; color: #a93226; border-color: #e74c3c; }
    .alert-info    { background: #e8f4fb; color: #1a5f8a; border-color: #3a9fd8; }
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 13px; font-weight: 600;
      color: #1e2d3d; margin-bottom: 6px;
    }
    .form-control {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #dce6ef; border-radius: 8px;
      font-size: 14px; color: #1e2d3d; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control:focus {
      border-color: #3a9fd8;
      box-shadow: 0 0 0 3px rgba(58,159,216,0.18);
    }
    .btn-login {
      width: 100%; padding: 12px;
      background: #3a9fd8; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }
    .btn-login:hover { background: #2980b9; transform: translateY(-1px); }
    .login-footer {
      text-align: center; margin-top: 20px;
      color: rgba(255,255,255,0.6); font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-header">
      <div class="logo-circle"><span>H</span></div>
      <h1>Hopestone Hospital</h1>
      <p>Payment Tracker — Staff Portal</p>
    </div>

    <div class="login-card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-control" type="email" id="email" name="email"
                 placeholder="yourname@hopestone.ng" required autofocus />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password"
                 placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-login">Sign In →</button>
      </form>
    </div>

    <div class="login-footer">© {{ 2025 }} Hopestone Hospital · Secure Staff Portal</div>
  </div>
</body>
</html>
