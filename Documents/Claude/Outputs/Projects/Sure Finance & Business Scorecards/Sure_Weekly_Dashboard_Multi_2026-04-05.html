<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sure Finance — Multi-Period Dashboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;color:#1f2937;font-size:13px}
  .header{background:linear-gradient(135deg,#006b75,#0ea5e9);color:#fff;padding:18px 28px}
  .header h1{font-size:19px;font-weight:700}
  .header .sub{font-size:11px;opacity:.8;margin-top:3px}
  .filters{background:#fff;padding:12px 24px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}
  .filters label{font-size:11px;color:#6b7280;font-weight:600;margin-right:4px}
  .filters select,.filters button{padding:5px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;background:#fff;cursor:pointer}
  .filters button.active{background:#006b75;color:#fff;border-color:#006b75}
  .main{padding:18px 22px}
  .kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  .kpi{background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-top:3px solid #006b75}
  .kpi .label{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
  .kpi .value{font-size:18px;font-weight:700}
  .section{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:16px;overflow:hidden}
  .section-title{background:#1f2937;color:#fff;padding:9px 14px;font-size:12px;font-weight:600}
  table{width:100%;border-collapse:collapse}
  th{background:#374151;color:#fff;padding:7px 9px;text-align:right;font-size:11px;white-space:nowrap}
  th.left,td.left{text-align:left}
  td{padding:6px 9px;text-align:right;border-bottom:1px solid #f1f5f9;font-size:12px}
  tr:nth-child(even){background:#f9fafb}
  .tfoot td{background:#006b75;color:#fff;font-weight:700;border:none}
  .week-table td{font-size:11px}
</style>
</head>
<body>
<div class="header">
  <h1>Sure Finance — Multi-Period Performance Dashboard</h1>
  <div class="sub">History: 1 week(s) &nbsp;·&nbsp; Latest: Mon 30 Mar – Sun 5 Apr 2026 &nbsp;·&nbsp; Updated 06 Apr 2026</div>
</div>

<div class="filters">
  <div>
    <label>VIEW:</label>
    <button class="active" onclick="setView('summary',this)">Summary</button>
    <button onclick="setView('weekly',this)">Weekly Drill-down</button>
  </div>
  <div>
    <label>YEAR:</label>
    <select id="yearSel" onchange="render()"><option value="all">All</option></select>
  </div>
  <div>
    <label>MONTH:</label>
    <select id="monthSel" onchange="render()"><option value="all">All</option></select>
  </div>
  <div>
    <label>WEEK:</label>
    <select id="weekSel" onchange="render()"><option value="all">All</option></select>
  </div>
</div>

<div class="main">
  <div id="summaryView"></div>
  <div id="weeklyView" style="display:none"></div>
</div>

const CENTRES = ["OAUTH Ilesa Centre","Ilasa Main Centre, Lagos","Palm Avenue, Lagos","Sure Ilesha, Osun"];

let currentView = 'summary';

function setView(v, btn) {
  currentView = v;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('summaryView').style.display = v==='summary'?'block':'none';
  document.getElementById('weeklyView').style.display  = v==='weekly'?'block':'none';
  render();
}

function fmtN(n) { return '₦' + Number(n).toLocaleString('en-NG'); }
function pct(a,b) { return b ? (a/b*100).toFixed(1)+'%' : '—'; }

function initFilters() {
  const years = new Set(), months = new Set();
  Object.keys(ALL_DATA).forEach(k => {
    // key format: YYYY-MM-DD_YYYY-MM-DD
    const yr = k.substring(0,4);
    const mo = k.substring(0,7);
    years.add(yr); months.add(mo);
  });
  const ySel = document.getElementById('yearSel');
  const mSel = document.getElementById('monthSel');
  const wSel = document.getElementById('weekSel');

  [...years].sort().forEach(y => {
    const o = document.createElement('option'); o.value=y; o.textContent=y; ySel.appendChild(o);
  });
  [...months].sort().forEach(m => {
    const o = document.createElement('option'); o.value=m;
    const d = new Date(m+'-01'); o.textContent=d.toLocaleString('en',{month:'long',year:'numeric'});
    mSel.appendChild(o);
  });
  Object.keys(ALL_DATA).sort().reverse().forEach(k => {
    const o = document.createElement('option'); o.value=k;
    const w = ALL_DATA[k]; o.textContent = w.week_title || k;
    wSel.appendChild(o);
  });
}

function getFiltered() {
  const yr = document.getElementById('yearSel').value;
  const mo = document.getElementById('monthSel').value;
  const wk = document.getElementById('weekSel').value;
  return Object.entries(ALL_DATA).filter(([k,v]) => {
    if (wk !== 'all' && k !== wk) return false;
    if (yr !== 'all' && !k.startsWith(yr)) return false;
    if (mo !== 'all' && !k.startsWith(mo)) return false;
    return true;
  }).sort(([a],[b]) => a.localeCompare(b));
}

function render() {
  if (currentView === 'summary') renderSummary();
  else renderWeekly();
}

function renderSummary() {
  const filtered = getFiltered();
  if (!filtered.length) { document.getElementById('summaryView').innerHTML='<p style="padding:20px;color:#666">No data for selected filters.</p>'; return; }

  // Aggregate
  let totCases=0,totInv=0,totRev=0,totPaid=0,totDue=0,totRefs=0;
  const ctMap = {};
  CENTRES.forEach(c => ctMap[c]={cases:0,inv:0,rev:0,paid:0,due:0});

  filtered.forEach(([k,w]) => {
    totCases += w.totalCases||0; totInv += w.totalInv||0;
    totRev += w.totalRev||0; totPaid += w.totalPaid||0;
    totDue += w.totalDue||0; totRefs += w.totalRefs||0;
    (w.daily||[]).forEach(d => {
      if (ctMap[d.centre]) {
        ctMap[d.centre].cases += d.cases||0;
        ctMap[d.centre].inv   += d.inv||0;
        ctMap[d.centre].rev   += d.rev||0;
        ctMap[d.centre].paid  += d.paid||0;
        ctMap[d.centre].due   += d.due||0;
      }
    });
  });

  const nWeeks = filtered.length;
  const cRows = CENTRES.map(c => {
    const d = ctMap[c];
    return `<tr>
      <td class="left">${c}</td>
      <td>${d.cases}</td><td>${d.inv}</td>
      <td>${fmtN(d.rev)}</td><td>${fmtN(d.paid)}</td>
      <td>${d.due>0?'<span style="color:#dc2626">'+fmtN(d.due)+'</span>':fmtN(d.due)}</td>
      <td>${pct(d.rev,totRev)}</td>
    </tr>`;
  }).join('');

  document.getElementById('summaryView').innerHTML = `
  <div class="kpi-grid">
    <div class="kpi"><div class="label">Weeks</div><div class="value">${nWeeks}</div></div>
    <div class="kpi"><div class="label">Total Cases</div><div class="value">${totCases}</div></div>
    <div class="kpi"><div class="label">Investigations</div><div class="value">${totInv}</div></div>
    <div class="kpi"><div class="label">Total Revenue</div><div class="value" style="font-size:14px">${fmtN(totRev)}</div></div>
    <div class="kpi"><div class="label">Paid</div><div class="value" style="font-size:14px">${fmtN(totPaid)}</div></div>
    <div class="kpi ${totDue>0?'':''}" style="${totDue>0?'border-top-color:#dc2626':''}"><div class="label">Due</div><div class="value" style="font-size:14px;${totDue>0?'color:#dc2626':''}">${fmtN(totDue)}</div></div>
  </div>
  <div class="section">
    <div class="section-title">Centre Performance (Aggregated — ${nWeeks} week${nWeeks>1?'s':''})</div>
    <table>
      <thead><tr><th class="left">Centre</th><th>Cases</th><th>Inv.</th><th>Revenue</th><th>Paid</th><th>Due</th><th>Rev %</th></tr></thead>
      <tbody>${cRows}</tbody>
      <tfoot class="tfoot"><tr><td>TOTAL</td><td>${totCases}</td><td>${totInv}</td><td>${fmtN(totRev)}</td><td>${fmtN(totPaid)}</td><td>${fmtN(totDue)}</td><td>100%</td></tr></tfoot>
    </table>
  </div>`;
}

function renderWeekly() {
  const filtered = getFiltered();
  if (!filtered.length) { document.getElementById('weeklyView').innerHTML='<p style="padding:20px;color:#666">No data.</p>'; return; }

  const rows = filtered.map(([k,w]) => {
    const ct = {};
    CENTRES.forEach(c => ct[c]={cases:0,rev:0});
    (w.daily||[]).forEach(d => { if(ct[d.centre]){ ct[d.centre].cases+=d.cases||0; ct[d.centre].rev+=d.rev||0; } });
    const cCells = CENTRES.map(c => `<td>${ct[c].cases}</td><td style="font-size:11px">${fmtN(ct[c].rev)}</td>`).join('');
    return `<tr>
      <td class="left" style="white-space:nowrap">${w.week_title||k}</td>
      <td>${w.totalCases||0}</td>
      <td>${fmtN(w.totalRev||0)}</td>
      <td>${fmtN(w.totalPaid||0)}</td>
      ${cCells}
    </tr>`;
  }).join('');

  const cHeaders = CENTRES.map(c => `<th colspan="2">${c.split(',')[0]}</th>`).join('');
  const cSubHeaders = CENTRES.map(() => '<th>Cases</th><th>Revenue</th>').join('');

  document.getElementById('weeklyView').innerHTML = `
  <div class="section">
    <div class="section-title">Weekly Drill-down (${filtered.length} week${filtered.length>1?'s':''})</div>
    <table class="week-table">
      <thead>
        <tr><th class="left">Week</th><th>Cases</th><th>Revenue</th><th>Paid</th>${cHeaders}</tr>
        <tr><th></th><th></th><th></th><th></th>${cSubHeaders}</tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

initFilters();
render();
</script>
</body>
</html>
