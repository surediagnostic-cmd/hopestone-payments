<style>
:root{color-scheme:light;
  --navy:#1F3864;--teal:#2E86AB;--green:#27AE60;--amber:#E67E22;--red:#E74C3C;
  --bg:#F0F4F8;--card:#fff;--border:#DDE3EA;--text:#2C3E50;--text2:#555;--sub:#888;--muted:#aaa;
  --hdr-bg:#1F3864;--hdr-txt:#fff;--ctrl-bg:#fff;--input-bg:#fff;
  --tbl-head:#1F3864;--tbl-even:#F7FAFC;--tbl-hover:#EBF5FB;--tbl-total-bg:#2E86AB;}
body.dark{color-scheme:dark;
  --bg:#0f1624;--card:#1a2235;--border:#2d3a50;--text:#e2e8f0;--text2:#a0aec0;--sub:#718096;--muted:#4a5568;
  --hdr-bg:#0d1321;--ctrl-bg:#141f32;--input-bg:#1a2235;
  --tbl-head:#0d1321;--tbl-even:#1e2d44;--tbl-hover:#243451;--tbl-total-bg:#1e4a6b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px;transition:background .25s,color .25s;}
.hdr{background:var(--hdr-bg);color:var(--hdr-txt);padding:11px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.hdr h1{font-size:15px;font-weight:700;letter-spacing:.4px;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.hdr-meta{font-size:11px;opacity:.7;text-align:right;}
.theme-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 10px;border-radius:20px;cursor:pointer;font-size:12px;transition:.2s;}
.theme-btn:hover{background:rgba(255,255,255,.25);}
.ctrl{background:var(--ctrl-bg);border-bottom:2px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;transition:background .25s;}
.ctrl-lbl{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-right:2px;white-space:nowrap;}
.ctrl-sep{width:1px;height:24px;background:var(--border);margin:0 6px;}
.pill{padding:4px 11px;border:1.5px solid var(--border);border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;background:var(--input-bg);color:var(--text2);transition:.15s;white-space:nowrap;}
.pill:hover{border-color:var(--teal);color:var(--teal);}
.pill.active{background:var(--teal);border-color:var(--teal);color:#fff;}
.ctrl select{font-size:12px;padding:4px 8px;border:1.5px solid var(--border);border-radius:6px;background:var(--input-bg);color:var(--text);font-weight:600;cursor:pointer;max-width:220px;}
.ctrl select:focus{outline:none;border-color:var(--teal);}
.qbadge{margin-left:auto;background:linear-gradient(135deg,var(--teal),var(--navy));color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.main{padding:14px 20px;max-width:1500px;margin:0 auto;}
.section-title{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--border);}
body.dark .section-title{color:var(--teal);}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px;}
.kpi{background:var(--card);border-radius:10px;padding:11px 12px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-top:4px solid var(--teal);text-align:center;transition:background .25s;}
.kpi-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);font-weight:700;}
.kpi-val{font-size:19px;font-weight:800;color:var(--navy);margin:4px 0 2px;}
body.dark .kpi-val{color:var(--text);}
.kpi-sub{font-size:10px;color:var(--muted);}
.centre-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.centre-card{background:var(--card);border-radius:10px;padding:13px;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:background .25s;}
.cc-head{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.cc-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.cc-name{font-size:12px;font-weight:700;color:var(--text);}
.cc-rev{font-size:21px;font-weight:800;color:var(--text);margin-bottom:1px;}
.cc-tgt{font-size:10px;color:var(--sub);margin-bottom:7px;}
.prog-bg{background:var(--bg);border-radius:6px;height:7px;margin-bottom:5px;}
.prog-fill{height:7px;border-radius:6px;}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;}
.badge-g{background:#D5F5E3;color:#1E8449;}
.badge-a{background:#FCF3CF;color:#9A7D0A;}
.badge-r{background:#FADBD8;color:#922B21;}
.cc-stats{display:flex;margin-top:7px;border-top:1px solid var(--border);padding-top:7px;}
.cc-stat{flex:1;text-align:center;}
.cc-stat-v{font-size:13px;font-weight:700;color:var(--text);}
.cc-stat-l{font-size:9px;color:var(--muted);text-transform:uppercase;}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.chart-card{background:var(--card);border-radius:10px;padding:13px;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:background .25s;}
.chart-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px;}
.chart-wrap{position:relative;height:195px;}
.tbl-card{background:var(--card);border-radius:10px;padding:13px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:12px;overflow-x:auto;transition:background .25s;}
.tbl-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:9px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--tbl-head);color:#fff;}
thead th{padding:6px 9px;font-size:11px;font-weight:700;text-align:center;white-space:nowrap;}
thead th:first-child{text-align:left;}
tbody tr:nth-child(even){background:var(--tbl-even);}
tbody tr:hover{background:var(--tbl-hover);}
tbody td{padding:5px 9px;border-bottom:1px solid var(--border);font-size:12px;text-align:center;white-space:nowrap;color:var(--text);}
tbody td:first-child{text-align:left;font-weight:600;}
.total-row td{background:var(--tbl-total-bg)!important;color:#fff!important;font-weight:700;}
.footer{text-align:center;padding:10px;font-size:10px;color:var(--muted);background:var(--card);border-top:1px solid var(--border);margin-top:14px;}
@media(max-width:1100px){.centre-grid{grid-template-columns:repeat(2,1fr);}.two-col{grid-template-columns:1fr;}}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr);}.charts-row{grid-template-columns:1fr;}}
@media(max-width:600px){.kpi-row{grid-template-columns:repeat(2,1fr);}.centre-grid{grid-template-columns:1fr;}}
</style>
</head>

  <div class="section-title">&#128203; PERFORMANCE TABLE</div>

  <div class="section-title">&#128101; TOP REFERRERS &amp; AGENTS</div>
  <div class="two-col">
    <div class="tbl-card">

      <div style="overflow-x:auto"><table id="refTable"></table></div>
    </div>
    <div class="tbl-card">
      <div class="tbl-title">&#128100; Agent Performance</div>
      <div style="overflow-x:auto"><table id="agentTable"></table></div>

</div>
<div class="footer" id="footerBox"></div>

  render();

function getYears() { return [...new Set(HISTORY.map(w=>w.year))].sort((a,b)=>a-b); }

function setup() {
  const yrSel = document.getElementById('yrSel');
  getYears().forEach(y => yrSel.add(new Option(y,y)));
  yrSel.value = getYears().slice(-1)[0];
  buildBranchPills();
  onYearChange();
}

function buildBranchPills() {
  const centres = [...new Set(HISTORY.flatMap(w => w.centres.map(c=>c.name)))];
  const shortMap = {};
  HISTORY.forEach(w => w.centres.forEach(c => { shortMap[c.name] = c.short; }));
  document.getElementById('branchPills').innerHTML = ['all', ...centres].map(c =>
    `<button class="pill${c==='all'?' active':''}" onclick="setBranch('${c.replace(/'/g,"&#39;")}',this)">${c==='all'?'All':shortMap[c]||c}</button>`
  ).join('');
}

function onYearChange() {
  const yr = +document.getElementById('yrSel').value;
  const months = [...new Set(HISTORY.filter(w=>w.year===yr).map(w=>w.month))].sort((a,b)=>a-b);
  document.getElementById('monPills').innerHTML = [0,...months].map(m =>
    `<button class="pill${m===selMonth?' active':''}" onclick="setMonth(${m},this)">${m===0?'All':MONTHS[m]}</button>`
  ).join('');
  selMonth = 0;
  buildWeekDropdown(yr, 0);
}

function setMonth(m, el) {
  selMonth = m;
  document.querySelectorAll('#monPills .pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  buildWeekDropdown(+document.getElementById('yrSel').value, m);
}

function setBranch(b, el) {
  selBranch = b;
  document.querySelectorAll('#branchPills .pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  render();
}

function buildWeekDropdown(yr, mon) {
  const wkSel = document.getElementById('wkSel');
  const prev = wkSel.value;
  wkSel.innerHTML = '';
  const filtered = HISTORY.filter(w => w.year===yr && (mon===0 || w.month===mon));
  wkSel.add(new Option('All Weeks','all'));
  filtered.forEach(w => wkSel.add(new Option(w.label, w.week_key)));
  if ([...wkSel.options].find(o=>o.value===prev)) wkSel.value = prev;
  else wkSel.value = filtered.length ? filtered[filtered.length-1].week_key : 'all';
  render();
}

  const yr = +document.getElementById('yrSel').value;

    });
  });
  const agents = Object.values(agMap).filter(a=>a.revenue>0).sort((a,b)=>b.revenue-a.revenue);

  const isAll = document.getElementById('wkSel').value==='all';
  return {summary:sum,centres,referrers,agents,
    label:isAll?`${weeks.length} week${weeks.length>1?'s':''} aggregated`:weeks[0].label,
    quarter:weeks[weeks.length-1].quarter};
}

function render() {
  const weeks = getFilteredWeeks();
  if (!weeks.length) return;
  const agg = aggregateWeeks(weeks);
  if (!agg) return;

  const centres = selBranch==='all' ? agg.centres : agg.centres.filter(c=>c.name===selBranch);
  const refList = selBranch==='all' ? agg.referrers : agg.referrers.filter(r=>r.centre===selBranch);

  document.getElementById('subTitle').textContent = agg.label;
  document.getElementById('qBadge').textContent = agg.quarter;
  document.getElementById('metaBox').innerHTML = `<div>${agg.label}</div><div style="margin-top:2px">${HISTORY.length} week${HISTORY.length>1?'s':''} in history</div>`;

  const s = agg.summary;
  let kpiRev=s.total_revenue, kpiTgt=agg.centres.reduce((a,c)=>a+c.weekly_target,0);
  let kpiCases=s.total_cases,kpiPat=s.total_patients,kpiInv=s.total_investigations,kpiRef=s.total_unique_referrers;
  let kpiCR=s.collection_rate,kpiDue=s.total_due;
  if (selBranch!=='all'&&centres.length) {
    const bc=centres[0]; kpiRev=bc.revenue; kpiTgt=bc.weekly_target;
    kpiCases=bc.cases; kpiPat=bc.patients; kpiInv=bc.investigations; kpiRef=bc.referrers;
  }
  const att=kpiTgt?kpiRev/kpiTgt*100:0;
  document.getElementById('kpiRow').innerHTML=`
    <div class="kpi"><div class="kpi-lbl">Total Revenue</div><div class="kpi-val">${fmt(kpiRev)}</div><div class="kpi-sub">vs ${fmt(kpiTgt)} target</div></div>
    <div class="kpi" style="border-top-color:#27AE60"><div class="kpi-lbl">Attainment</div><div class="kpi-val" style="color:${pcol(att)}">${pct(att)}</div><div class="kpi-sub">of target</div></div>
    <div class="kpi" style="border-top-color:#8E44AD"><div class="kpi-lbl">Cases</div><div class="kpi-val">${kpiCases}</div><div class="kpi-sub">${kpiPat} patients</div></div>
    <div class="kpi" style="border-top-color:#16A085"><div class="kpi-lbl">Investigations</div><div class="kpi-val">${kpiInv}</div><div class="kpi-sub">tests performed</div></div>
    <div class="kpi" style="border-top-color:#E67E22"><div class="kpi-lbl">Referrers</div><div class="kpi-val">${kpiRef}</div><div class="kpi-sub">unique this period</div></div>
    <div class="kpi" style="border-top-color:${kpiCR>=95?'#27AE60':'#E74C3C'}"><div class="kpi-lbl">Collection Rate</div><div class="kpi-val" style="color:${kpiCR>=95?'#27AE60':'#E74C3C'}">${pct(kpiCR)}</div><div class="kpi-sub">₦${(kpiDue/1000).toFixed(0)}K outstanding</div></div>`;

  document.getElementById('centreTitle').innerHTML = '&#127970; CENTRE PERFORMANCE' + (selBranch!=='all'?` &mdash; ${centres[0]?.short||''}` : '');
  document.getElementById('centreGrid').innerHTML = centres.map(c=>`
    <div class="centre-card">
      <div class="cc-head"><div class="cc-dot" style="background:${c.color}"></div><div class="cc-name">${c.name}</div></div>
      <div class="cc-rev">${fmt(c.revenue)}</div>
      <div class="cc-tgt">Target: ${fmt(c.weekly_target)} &bull; ${badge(c.attainment)}</div>
      <div class="prog-bg"><div class="prog-fill" style="width:${Math.min(c.attainment,100)}%;background:${pcol(c.attainment)}"></div></div>
      <div class="cc-stats">
        <div class="cc-stat"><div class="cc-stat-v">${c.cases}</div><div class="cc-stat-l">Cases</div></div>
        <div class="cc-stat"><div class="cc-stat-v">${c.patients}</div><div class="cc-stat-l">Patients</div></div>
        <div class="cc-stat"><div class="cc-stat-v">${c.investigations}</div><div class="cc-stat-l">Tests</div></div>
        <div class="cc-stat"><div class="cc-stat-v">${c.referrers}</div><div class="cc-stat-l">Referrers</div></div>
      </div>
    </div>`).join('');

  const gc=darkMode?'rgba(255,255,255,.07)':'#eee', tc=darkMode?'#a0aec0':'#555';
  if (barC){barC.destroy();barC=null;}
  barC=new Chart(document.getElementById('barChart').getContext('2d'),{type:'bar',
    data:{labels:centres.map(c=>c.short),datasets:[
      {label:'Revenue',data:centres.map(c=>c.revenue),backgroundColor:centres.map(c=>c.color+'BB'),borderColor:centres.map(c=>c.color),borderWidth:1.5,borderRadius:5},
      {label:'Target',data:centres.map(c=>c.weekly_target),backgroundColor:'transparent',borderColor:darkMode?'#718096':'#bbb',borderWidth:1.5,borderRadius:5}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{size:10},color:tc}}},
      scales:{y:{ticks:{callback:v=>fmt(v),font:{size:10},color:tc},grid:{color:gc}},x:{ticks:{font:{size:10},color:tc},grid:{display:false}}}}});

  if (lineC){lineC.destroy();lineC=null;}
  const yr=+document.getElementById('yrSel').value;
  const yearWks=HISTORY.filter(w=>w.year===yr&&(selMonth===0||w.month===selMonth));
  const allShorts=[...new Set(yearWks.flatMap(w=>w.centres.map(c=>c.short)))];
  const colMap={};yearWks.forEach(w=>w.centres.forEach(c=>{colMap[c.short]=c.color;}));
  let lineShorts=allShorts;
  if (selBranch!=='all'){
    const found=HISTORY.flatMap(w=>w.centres).find(c=>c.name===selBranch);
    if(found) lineShorts=[found.short];
  }
  lineC=new Chart(document.getElementById('lineChart').getContext('2d'),{type:'line',
    data:{labels:yearWks.map(w=>w.label.split('–')[0].trim()),
      datasets:lineShorts.map(cs=>({label:cs,data:yearWks.map(w=>(w.centres.find(c=>c.short===cs)||{}).revenue||0),
        borderColor:colMap[cs],backgroundColor:colMap[cs]+'22',borderWidth:2,pointRadius:4,tension:.3,fill:false}))},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{size:10},color:tc}}},
      scales:{y:{ticks:{callback:v=>fmt(v),font:{size:10},color:tc},grid:{color:gc}},x:{ticks:{font:{size:9},maxRotation:30,color:tc},grid:{display:false}}}}});

  const cols=['Centre','Revenue','Target','Attainment','Cases','Patients','Tests','Referrers'];
  const rows=centres.map(c=>[
    `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:5px"></span>${c.name}`,
    fmt(c.revenue),fmt(c.weekly_target),badge(c.attainment),c.cases,c.patients,c.investigations,c.referrers]);
  if(selBranch==='all'){
    const tR=centres.reduce((a,c)=>a+c.revenue,0),tT=centres.reduce((a,c)=>a+c.weekly_target,0);
    rows.push(['<strong>TOTAL</strong>',fmt(tR),fmt(tT),badge(tT?tR/tT*100:0),kpiCases,kpiPat,kpiInv,kpiRef]);
  }
  document.getElementById('perfTable').innerHTML=`
    <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r,i)=>`<tr class="${i===rows.length-1&&selBranch==='all'?'total-row':''}">${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody>`;

  document.getElementById('refBranchLabel').textContent=selBranch==='all'?'— All Branches':`— ${centres[0]?.short||''}`;
  const top20=refList.slice(0,20);
  document.getElementById('refTable').innerHTML=top20.length?`
    <thead><tr><th>Referrer</th><th>Centre</th><th>Cases</th><th>Tests</th><th>Revenue</th></tr></thead>
    <tbody>${top20.map(r=>`<tr><td>${r.referrer.trim()}</td><td>${r.centre.replace(/, Lagos|, Osun/g,'')}</td><td>${r.cases}</td><td>${r.investigations}</td><td>${fmt(r.revenue)}</td></tr>`).join('')}</tbody>`
    :`<tbody><tr><td colspan="5" style="text-align:center;color:var(--sub);padding:14px">No referrer data</td></tr></tbody>`;

  const topAgents=agg.agents.slice(0,15);
  document.getElementById('agentTable').innerHTML=topAgents.length?`
    <thead><tr><th>Agent</th><th>Cases</th><th>Patients</th><th>Tests</th><th>Revenue</th><th>Paid</th></tr></thead>
    <tbody>${topAgents.map(a=>`<tr><td>${a.agent}</td><td>${a.cases}</td><td>${a.patients}</td><td>${a.investigations}</td><td>${fmt(a.revenue)}</td><td>${fmt(a.paid)}</td></tr>`).join('')}</tbody>`
    :`<tbody><tr><td colspan="6" style="text-align:center;color:var(--sub);padding:14px">No agent data</td></tr></tbody>`;

  const now=new Date();
  document.getElementById('footerBox').textContent=`Sure Finance & Business Dashboard • ${HISTORY.length} week${HISTORY.length>1?'s':''} in history • ${now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;
}

window.onload=setup;
</script>
</body>
</html>
