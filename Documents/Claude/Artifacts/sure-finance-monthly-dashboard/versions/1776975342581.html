:root{color-scheme:light;}
*{box-sizing:border-box;margin:0;padding:0;}

h1{font-size:17px;font-weight:700;color:#1a1a2e;}
.subtitle{font-size:11px;color:#666;margin-bottom:12px;margin-top:2px;}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px 14px;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.09);}
.controls select{padding:5px 8px;border:1px solid #d0d7de;border-radius:5px;font-size:12px;background:#fff;cursor:pointer;}
.controls label{font-size:11px;color:#555;font-weight:600;}
.tbtn{padding:5px 12px;border:1.5px solid #1976D2;border-radius:5px;font-size:12px;cursor:pointer;background:#fff;color:#1976D2;font-weight:600;transition:all .15s;}

.sep{width:1px;height:20px;background:#e0e0e0;flex-shrink:0;}
.kpi{background:linear-gradient(130deg,#1a237e 0%,#283593 100%);color:#fff;border-radius:10px;padding:14px 20px;margin-bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.kpi-lbl{font-size:9px;opacity:.65;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
.kpi-val{font-size:22px;font-weight:700;line-height:1;}
.kpi-sub{font-size:10px;opacity:.6;margin-top:3px;}
.kpi-bar{height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:6px;overflow:hidden;}
.kpi-fill{height:100%;border-radius:2px;transition:width .4s;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card{background:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.card h3{font-size:11px;font-weight:600;color:#555;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
canvas{max-height:195px;}
</style>
</head>

<p class="subtitle">Monthly Performance Dashboard &mdash; updated Q1 2026</p>

  <label>Branch:</label>

</div>

<div class="grid">

let vm='monthly',charts={};

function fN(v){return v==null?'—':Math.round(v).toLocaleString();}
function fM(v){if(v==null)return'—';v=Math.round(v);if(Math.abs(v)>=1e6)return'\u20a6'+(v/1e6).toFixed(2)+'M';if(Math.abs(v)>=1e3)return'\u20a6'+(v/1e3).toFixed(1)+'k';return'\u20a6'+v.toLocaleString();}
function fK(v){if(v==null)return'—';if(Math.abs(v)>=1e6)return(v/1e6).toFixed(2)+'M';if(Math.abs(v)>=1e3)return(v/1e3).toFixed(1)+'k';return Math.round(v).toString();}
function getTgt(c,mo){return TGT[c]?TGT[c][mo]||0:0;}
function setV(v){vm=v;document.getElementById('bMo').classList.toggle('on',v==='monthly');document.getElementById('bYr').classList.toggle('on',v==='yearly');const h=v==='yearly'?'none':'';document.getElementById('lbMo').style.display=h;document.getElementById('sMonth').style.display=h;render();}
function gYear(){return parseInt(document.getElementById('sYear').value)||2026;}
function gMo(){return parseInt(document.getElementById('sMonth').value)||0;}
function gBr(){return document.getElementById('sBranch').value;}
function allBranches(){const s=new Set();Object.values(H).forEach(h=>Object.keys(h.centres).forEach(c=>s.add(c)));return[...s].sort();}
function filtKeys(){const yr=gYear(),mo=gMo();return Object.keys(H).filter(k=>{const h=H[k];if(vm==='yearly')return true;if(h.year!==yr)return false;if(mo>0&&h.month!==mo)return false;return true;}).sort();}

function mkChart(id,type,labels,datasets,opts){
  const ctx=document.getElementById(id).getContext('2d');
  if(charts[id])charts[id].destroy();
  const isH=opts&&opts.indexAxis==='y';
  charts[id]=new Chart(ctx,{type,data:{labels,datasets},options:{
    responsive:true,maintainAspectRatio:true,animation:{duration:250},
    plugins:{legend:{display:datasets.length>1,labels:{font:{size:9},boxWidth:10,padding:5}}},
    scales:isH?{x:{grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:9},callback:v=>fK(v)}},y:{grid:{display:false},ticks:{font:{size:9}}}}:
    {x:{grid:{display:false},stacked:opts&&opts.stacked,ticks:{font:{size:9}}},y:{grid:{color:'rgba(0,0,0,.05)'},stacked:opts&&opts.stacked,ticks:{font:{size:9},callback:v=>fK(v)}}}
  }});
}

function render(){

  let xl;
  if(vm==='yearly'){const yrs=[...new Set(keys.map(k=>H[k].year))].sort();xl=yrs.map(y=>''+y);}
  else if(mo===0){xl=keys.map(k=>MN[H[k].month]);}
  else{xl=[MN[mo]];}

  function bSeries(field){return branches.map(b=>({label:SH[b]||b,backgroundColor:COL[b]||'#888',data:(()=>{
    if(vm==='yearly'){const yrs=[...new Set(keys.map(k=>H[k].year))].sort();return yrs.map(y=>{let s=0;keys.filter(k=>H[k].year===y).forEach(k=>{const c=H[k].centres[b];if(c)s+=c[field]||0;});return s;});}
    else if(mo===0){return keys.map(k=>{const c=H[k].centres[b];return c?c[field]||0:0;});}
    else{const k=keys[0];if(!k)return[0];const c=H[k]&&H[k].centres[b];return[c?c[field]||0:0];}
  })()}));}

  const revDS=bSeries('revenue');
  const tgtData=(()=>{
    if(vm==='yearly'){const yrs=[...new Set(keys.map(k=>H[k].year))].sort();return yrs.map(y=>{let t=0;keys.filter(k=>H[k].year===y).forEach(k=>branches.forEach(b=>t+=getTgt(b,H[k].month)));return t;});}
    else if(mo===0){return keys.map(k=>{let t=0;branches.forEach(b=>t+=getTgt(b,H[k].month));return t;});}
    else{const k=keys[0];if(!k)return[0];let t=0;branches.forEach(b=>t+=getTgt(b,mo));return[t];}
  })();
  revDS.push({label:'Target',data:tgtData,type:'line',borderColor:'#FF6B00',borderDash:[5,3],borderWidth:2,pointRadius:3,fill:false,tension:.3,order:0});
  mkChart('cRev','bar',xl,revDS,{stacked:true});
  mkChart('cTests','bar',xl,bSeries('investigations'),{stacked:true});
  mkChart('cPat','bar',xl,bSeries('patients'),{stacked:true});
  mkChart('cRef','bar',xl,bSeries('unique_referrers'),{stacked:false});

  const ctMap={};
  keys.forEach(k=>{(H[k].case_types||[]).forEach(ct=>{if(br!=='all'&&ct.centre!==br)return;const bk=SH[ct.centre]+'|'+ct.case_type;if(!ctMap[bk])ctMap[bk]={label:SH[ct.centre],ct:ct.case_type,col:COL[ct.centre]||'#888',r:0};ctMap[bk].r+=ct.revenue||0;});});
  const cts=[...new Set(Object.values(ctMap).map(x=>x.ct))];
  const ctBr=[...new Set(Object.values(ctMap).map(x=>x.label))];
  mkChart('cCase','bar',cts,ctBr.map(b=>{const col=Object.values(ctMap).find(x=>x.label===b)?.col||'#888';return{label:b,backgroundColor:col,data:cts.map(ct=>{const e=Object.values(ctMap).find(x=>x.label===b&&x.ct===ct);return e?e.r:0;})};}),{stacked:true});

  const aMap={};
  keys.forEach(k=>(H[k].agents||[]).forEach(a=>{if(!aMap[a.agent])aMap[a.agent]={inv:0};aMap[a.agent].inv+=a.investigations||0;}));
  const top=Object.entries(aMap).sort((a,b)=>b[1].inv-a[1].inv).slice(0,10);
  mkChart('cAgent','bar',top.map(a=>a[0]),[{label:'Investigations',backgroundColor:'#1976D2',data:top.map(a=>a[1].inv)}],{indexAxis:'y'});

  let rev=0,inv=0,pat=0,tgt=0,ref=0;
  keys.forEach(k=>{const h=H[k];branches.forEach(b=>{const c=h.centres[b];if(!c)return;rev+=c.revenue||0;inv+=c.investigations||0;pat+=c.patients||0;ref+=c.unique_referrers||0;tgt+=getTgt(b,h.month);});});
  const pct=tgt>0?Math.min(100,rev/tgt*100):0;
  document.getElementById('kRev').textContent=fM(rev);
  document.getElementById('kRevS').textContent=tgt>0?pct.toFixed(1)+'% of '+fM(tgt)+' target':'';
  const bar=document.getElementById('kRevB');bar.style.width=pct+'%';bar.style.background=pct>=100?'#69F0AE':pct>=70?'#FFD740':'#FF6E6E';
  document.getElementById('kInv').textContent=fN(inv);document.getElementById('kInvS').textContent='investigations';
  document.getElementById('kPat').textContent=fN(pat);document.getElementById('kPatS').textContent='patients';
  document.getElementById('kRef').textContent=fN(ref);document.getElementById('kRefS').textContent='referrer entries';
}

function init(){
  const yrs=[...new Set(Object.values(H).map(h=>h.year))].sort().reverse();
  document.getElementById('sYear').innerHTML=yrs.map(y=>`<option value="${y}">${y}</option>`).join('');
  render();
}
init();
</script>
