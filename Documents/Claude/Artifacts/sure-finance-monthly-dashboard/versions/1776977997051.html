function fmtN(v){ if(v>=1e9) return "\u20a6"+(v/1e9).toFixed(2)+"B"; if(v>=1e6) return "\u20a6"+(v/1e6).toFixed(2)+"M"; if(v>=1e3) return "\u20a6"+(v/1e3).toFixed(1)+"K"; return "\u20a6"+Math.round(v).toLocaleString(); }

}

const stackedTotalsPlugin={
  id:"stackedTotals",
  afterDraw(chart,args,opts){
    if(!opts||!opts.enabled) return;
    const ctx=chart.ctx; const isH=chart.options.indexAxis==="y";
    const n=(chart.data.labels||[]).length;
    const totals=new Array(n).fill(0);
    chart.data.datasets.forEach((ds,di)=>{
      if(ds.type==="line") return;
      const meta=chart.getDatasetMeta(di); if(meta.hidden) return;
      (ds.data||[]).forEach((v,i)=>{totals[i]+=Number(v)||0;});
    });
    const anchor=new Array(n).fill(isH?-Infinity:Infinity);
    const xC=new Array(n).fill(0); const yC=new Array(n).fill(0);
    chart.data.datasets.forEach((ds,di)=>{
      if(ds.type==="line") return;
      const meta=chart.getDatasetMeta(di); if(meta.hidden) return;
      meta.data.forEach((bar,i)=>{xC[i]=bar.x; yC[i]=bar.y;
        if(isH){if(bar.x>anchor[i])anchor[i]=bar.x;}
        else{const v=Number((ds.data||[])[i]||0);if(v>0&&bar.y<anchor[i])anchor[i]=bar.y;}
      });
    });
    ctx.save(); ctx.font="bold 10px Arial,sans-serif"; ctx.fillStyle="#333";
    for(let i=0;i<n;i++){
      if(!totals[i]) continue; const text=fmtC(totals[i]);
      if(isH){if(anchor[i]===-Infinity)continue;ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(text,anchor[i]+4,yC[i]);}
      else{if(anchor[i]===Infinity)continue;ctx.textAlign="center";ctx.textBaseline="bottom";ctx.fillText(text,xC[i],anchor[i]-3);}
    }
    ctx.restore();
  }
};
Chart.register(stackedTotalsPlugin);

  if(charts[id]){charts[id].destroy();}
  const opts={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:"bottom",labels:{boxWidth:11,font:{size:9},color:"#555"}},
      stackedTotals:stacked?{enabled:true}:{enabled:false}},
    scales:{x:{stacked:!!stacked,ticks:{color:"#555"},grid:{color:"rgba(0,0,0,0.06)"}},
      y:{stacked:!!stacked,beginAtZero:true,ticks:{color:"#555"},grid:{color:"rgba(0,0,0,0.06)"},
         title:{display:!!yLabel,text:yLabel||"",font:{size:9},color:"#555"}}}};
  if(indexAxis)opts.indexAxis=indexAxis;
  charts[id]=new Chart(document.getElementById(id),{type,data:{labels,datasets},options:opts});
}

function mkRevChart(id,xLabels,barDs,month,year,branch){
  if(charts[id]){charts[id].destroy();}
  const tgtData=month===0
    ?xLabels.map((_,mi)=>{const m=mi+1;const cents=branch?[branch]:Object.keys(TARGETS);return cents.reduce((s,c)=>s+getMonthlyTarget(c,m),0);})
    :[branch?getMonthlyTarget(branch,month):Object.keys(TARGETS).reduce((s,c)=>s+getMonthlyTarget(c,month),0)];
  const tgtDs={label:"Target",type:"line",data:tgtData,borderColor:"#FF5722",borderWidth:2,
    borderDash:[6,3],pointStyle:"triangle",pointRadius:5,backgroundColor:"transparent",fill:false,tension:0,order:0};
  charts[id]=new Chart(document.getElementById(id),{type:"bar",
    data:{labels:xLabels,datasets:[...barDs,tgtDs]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"bottom",labels:{boxWidth:11,font:{size:9},color:"#555"}},stackedTotals:{enabled:true}},
      scales:{x:{stacked:true,ticks:{color:"#555"},grid:{color:"rgba(0,0,0,0.06)"}},
        y:{stacked:true,beginAtZero:true,ticks:{color:"#555"},grid:{color:"rgba(0,0,0,0.06)"},
           title:{display:true,text:"Revenue (NGN)",font:{size:9},color:"#555"}}}}});
}

function mkRevChartYearly(id,yLabels,barDs,branch){
  if(charts[id]){charts[id].destroy();}
  const cents=branch?[branch]:Object.keys(TARGETS);
  const annTgt=cents.reduce((s,c)=>s+(flatTargetsAnnual()[c]||0),0);
  const tgtDs={label:"Annual Target",type:"line",data:yLabels.map(()=>annTgt),borderColor:"#FF5722",
    borderWidth:2,borderDash:[6,3],pointStyle:"triangle",pointRadius:5,backgroundColor:"transparent",fill:false,tension:0,order:0};
  charts[id]=new Chart(document.getElementById(id),{type:"bar",
    data:{labels:yLabels,datasets:[...barDs,tgtDs]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"bottom",labels:{boxWidth:11,font:{size:9},color:"#555"}},stackedTotals:{enabled:true}},
      scales:{x:{stacked:true,ticks:{color:"#555"},grid:{color:"rgba(0,0,0,0.06)"}},
        y:{stacked:true,beginAtZero:true,ticks:{color:"#555"},grid:{color:"rgba(0,0,0,0.06)"},
           title:{display:true,text:"Revenue (NGN)",font:{size:9},color:"#555"}}}}});
}

function setView(v){
  currentView=v;
  document.getElementById("tabMonthly").classList.toggle("active",v==="monthly");
  document.getElementById("tabYearly").classList.toggle("active",v==="yearly");
  document.getElementById("monthSel").disabled=(v==="yearly");
  render();
}

function renderKPICard(centresRaw,branch,periodLabel,targets,monthCount){
  const cnames=branch?(centresRaw[branch]?[branch]:[]):Object.keys(centresRaw).sort();
  let rev=0,paid=0,due=0,cases=0,inv=0,pat=0,refs=0;
  cnames.forEach(c=>{
    const cd=centresRaw[c]||{};
    rev+=cd.revenue||0;paid+=cd.paid||0;due+=cd.due||0;
    cases+=cd.cases||0;inv+=cd.investigations||0;pat+=cd.patients||0;refs+=cd.unique_referrers||0;
  });
  const monthlyTgt=branch?(targets[branch]||0):Object.values(targets).reduce((s,v)=>s+v,0);
  const tgt=monthlyTgt*(monthCount||1);
  const pct=tgt?(rev/tgt*100):0;
  const sc=pct>=100?"#28a745":pct>=80?"#ffc107":"#dc3545";
  const title=branch||"All Branches";
  document.getElementById("kpiCard").innerHTML=
    "<h3 style=\"font-size:14px;color:#1F3864;margin-bottom:8px\">"+title+
    " &nbsp;<small style=\"font-weight:400;font-size:10px;color:#888\">"+periodLabel+"</small></h3>"+
    "<div class=\"kpi-grid\">"+
      "<div class=\"kpi\"><span class=\"kpi-lbl\">Revenue</span><span class=\"kpi-val\">"+fmtN(rev)+"</span></div>"+
      "<div class=\"kpi\"><span class=\"kpi-lbl\">Paid</span><span class=\"kpi-val\" style=\"color:#28a745\">"+fmtN(paid)+"</span></div>"+
      "<div class=\"kpi\"><span class=\"kpi-lbl\">Due / Receivables</span><span class=\"kpi-val\" style=\"color:#dc3545\">"+fmtN(due)+"</span></div>"+
      "<div class=\"kpi\"><span class=\"kpi-lbl\">Cases</span><span class=\"kpi-val\">"+cases.toLocaleString()+"</span></div>"+
      "<div class=\"kpi\"><span class=\"kpi-lbl\">Investigations</span><span class=\"kpi-val\">"+inv.toLocaleString()+"</span></div>"+
      "<div class=\"kpi\"><span class=\"kpi-lbl\">Patients</span><span class=\"kpi-val\">"+pat.toLocaleString()+"</span></div>"+
      "<div class=\"kpi\"><span class=\"kpi-lbl\">Active Referrers</span><span class=\"kpi-val\">"+refs.toLocaleString()+"</span></div>"+
      "<div class=\"kpi\"><span class=\"kpi-lbl\">% of Target</span><span class=\"kpi-val\" style=\"color:"+sc+"\">"+pct.toFixed(1)+"%</span></div>"+
    "</div>"+
    "<div class=\"tbar-wrap\"><div class=\"tbar\" style=\"width:"+Math.min(pct,100).toFixed(1)+"%;background:"+sc+"\"></div></div>"+
    "<p class=\"tlbl\" style=\"color:"+sc+"\">Target: "+fmtN(tgt)+"</p>";
}

function renderCaseTypeChart(entries,branch){
  const arr=(Array.isArray(entries)?entries:[entries]).filter(Boolean);
  const ctArr=arr.flatMap(e=>(e.case_types||[])).filter(r=>!branch||r.centre===branch);
  const ctTotals={}; ctArr.forEach(r=>{ctTotals[r.case_type]=(ctTotals[r.case_type]||0)+r.revenue;});
  const ctLabels=Object.keys(ctTotals).sort((a,b)=>ctTotals[b]-ctTotals[a]);
  const ctCents=branch?[branch]:[...new Set(ctArr.map(r=>r.centre))].sort();
  const ctDs=ctCents.map((c,i)=>({label:shortName(c),stack:"s",backgroundColor:bColor(c,i),
    data:ctLabels.map(ct=>{const rows=ctArr.filter(r=>r.centre===c&&r.case_type===ct);return Math.round(rows.reduce((s,r)=>s+r.revenue,0));})
  }));
  mkChart("cCT","bar",ctLabels,ctDs,"Revenue (NGN)",true);
}

function renderAgentsChart(agents){
  const top=agents.slice().sort((a,b)=>(b.revenue||0)-(a.revenue||0)).slice(0,10);
  const labels=top.map(a=>a.agent||"Unknown").reverse();
  const paid=top.map(a=>a.paid||0).reverse();
  const due=top.map(a=>((a.revenue||0)-(a.paid||0))).reverse();
  if(charts["cAgt"]){charts["cAgt"].destroy();}
  charts["cAgt"]=new Chart(document.getElementById("cAgt"),{type:"bar",
    data:{labels,datasets:[
      {label:"Paid",data:paid,backgroundColor:"#4CAF50",borderRadius:3,stack:"s"},
      {label:"Due", data:due, backgroundColor:"#FF7043",borderRadius:3,stack:"s"}
    ]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"bottom",labels:{boxWidth:11,font:{size:9},color:"#555"}},stackedTotals:{enabled:true}},
      scales:{x:{stacked:true,beginAtZero:true,ticks:{color:"#555"},grid:{color:"rgba(0,0,0,0.06)"},
                 title:{display:true,text:"Revenue (NGN)",font:{size:9},color:"#555"}},
              y:{stacked:true,ticks:{font:{size:10},color:"#555"},grid:{color:"rgba(0,0,0,0.06)"}}}}});
}

function renderRefTable(refs,branch){
  const rows=(branch?refs.filter(r=>r.centre===branch):refs).slice(0,25);
  if(!rows.length){document.getElementById("refTable").innerHTML="<p class=\"no-data\">No referrer data for this selection.</p>";return;}
  let html="<table><thead><tr><th>Centre</th><th>Referrer</th><th>Cases</th><th>Investigations</th><th>Revenue</th></tr></thead><tbody>";
  rows.forEach(r=>{html+="<tr><td>"+shortName(r.centre)+"</td><td>"+r.referrer+"</td><td>"+r.cases+"</td><td>"+r.investigations+"</td><td>"+fmtN(r.revenue)+"</td></tr>";});
  html+="</tbody></table>";
  document.getElementById("refTable").innerHTML=html;
}

function render(){
  const year=parseInt(document.getElementById("yearSel").value);
  const branch=document.getElementById("branchSel").value;
  const month=parseInt(document.getElementById("monthSel").value);
  if(currentView==="monthly")renderMonthly(year,branch,month);
  else renderYearly(branch);
}

function renderMonthly(year,branch,month){
  const monthKeys=Array.from({length:12},(_,i)=>year+"-"+String(i+1).padStart(2,"0"));
  const allEntries=monthKeys.map(k=>HISTORY[k]||null);
  const entries=month===0?allEntries:[allEntries[month-1]];
  const xLabels=month===0?MNAMES:[MNAMES[month-1]];
  const periodLabel=month===0?("Monthly — "+year):(MNAMES[month-1]+" "+year);

  document.getElementById("h1").textContent="Revenue by Location ("+periodLabel+")";
  document.getElementById("h2").textContent="Tests Completed ("+periodLabel+")";
  document.getElementById("h3").textContent="No. of Patients ("+periodLabel+")";
  document.getElementById("h4").textContent="Active Referrers ("+periodLabel+")";
  document.getElementById("subtitleLbl").textContent=periodLabel;

  const allCentres=branch?[branch]:[...new Set(entries.filter(Boolean).flatMap(e=>Object.keys(e.centres||{})))].sort();

  // --- KPI FIRST: compute and render before any chart calls ---
  const n_data=entries.filter(Boolean).length||1;
  const sumC={};
  allCentres.forEach(c=>{
    sumC[c]={investigations:0,cases:0,patients:0,revenue:0,paid:0,due:0,unique_referrers:0};
    entries.filter(Boolean).forEach(e=>{
      const cd=(e.centres||{})[c]; if(!cd)return;
      sumC[c].investigations+=cd.investigations||0;
      sumC[c].cases+=cd.cases||0;
      sumC[c].patients+=cd.patients||0;
      sumC[c].revenue+=cd.revenue||0;
      sumC[c].paid+=cd.paid||0;
      sumC[c].due+=cd.due||0;
      sumC[c].unique_referrers+=cd.unique_referrers||0;
    });
  });
  const kpiC={};
  allCentres.forEach(c=>{
    const sc=sumC[c]||{};
    kpiC[c]=month===0?{
      investigations:Math.round(sc.investigations/n_data),cases:Math.round(sc.cases/n_data),
      patients:Math.round(sc.patients/n_data),revenue:sc.revenue/n_data,paid:sc.paid/n_data,
      due:sc.due/n_data,unique_referrers:Math.round(sc.unique_referrers/n_data)
    }:{...sc};
  });
  const kpiTgt=month===0?flatTargetsAvg():flatTargetsForMonth(month);
  renderKPICard(kpiC,branch,periodLabel,kpiTgt,1);

  // --- Charts (wrapped in try/catch so KPI always shows) ---
  function dsM(field){return allCentres.map((c,i)=>({label:shortName(c),stack:"s",backgroundColor:bColor(c,i),
    data:entries.map(e=>{if(!e)return 0;const cd=(e.centres||{})[c];return cd?Math.round(cd[field]||0):0;})}));}
  function dsMRef(){return allCentres.map((c,i)=>({label:shortName(c),stack:"s",backgroundColor:bColor(c,i),
    data:entries.map(e=>{if(!e)return 0;const cd=(e.centres||{})[c];return cd?(cd.unique_referrers||0):0;})}));}

  try{mkRevChart("cRev",xLabels,dsM("revenue"),month,year,branch);}catch(ex){console.warn("cRev",ex);}
  try{mkChart("cInv","bar",xLabels,dsM("investigations"),"Investigations",true);}catch(ex){console.warn("cInv",ex);}
  try{mkChart("cPat","bar",xLabels,dsM("patients"),"Patients",true);}catch(ex){console.warn("cPat",ex);}
  try{mkChart("cRef","bar",xLabels,dsMRef(),"Unique Referrers",true);}catch(ex){console.warn("cRef",ex);}
  try{renderCaseTypeChart(entries,branch);}catch(ex){console.warn("cCT",ex);}

  const agentMap={};
  entries.filter(Boolean).forEach(e=>(e.agents||[]).forEach(a=>{
    if(!agentMap[a.agent])agentMap[a.agent]={agent:a.agent,investigations:0,cases:0,revenue:0,paid:0};
    agentMap[a.agent].investigations+=a.investigations||0;
    agentMap[a.agent].cases+=a.cases||0;
    agentMap[a.agent].revenue+=a.revenue||0;
    agentMap[a.agent].paid+=a.paid||0;
  }));
  try{renderAgentsChart(Object.values(agentMap));}catch(ex){console.warn("cAgt",ex);}

  const refMap={};
  entries.filter(Boolean).forEach(e=>(e.referrers||[])
    .filter(r=>!branch||r.centre===branch)
    .forEach(r=>{const k=r.centre+"|"+r.referrer;
      if(!refMap[k])refMap[k]={...r};
      else{refMap[k].cases+=r.cases;refMap[k].investigations+=r.investigations;refMap[k].revenue+=r.revenue;}
    }));
  renderRefTable(Object.values(refMap).sort((a,b)=>b.cases-a.cases),branch);
}

function renderYearly(branch){
  document.getElementById("h1").textContent="Revenue by Location (Yearly)";
  document.getElementById("h2").textContent="Tests Completed (Yearly)";
  document.getElementById("h3").textContent="No. of Patients (Yearly)";
  document.getElementById("h4").textContent="Active Referrers (Yearly)";
  document.getElementById("subtitleLbl").textContent="Yearly performance overview";

  const yearSet=[...new Set(Object.keys(HISTORY).map(k=>k.split("-")[0]))].sort();
  const allCentres=branch?[branch]:[...new Set(Object.values(HISTORY).flatMap(e=>Object.keys(e.centres||{})))].sort();

  // --- KPI FIRST ---
  const totC={};
  allCentres.forEach(c=>{
    totC[c]={investigations:0,cases:0,patients:0,revenue:0,paid:0,due:0,unique_referrers:0};
    Object.values(HISTORY).forEach(e=>{
      const cd=(e.centres||{})[c]; if(!cd)return;
      totC[c].investigations+=cd.investigations||0;
      totC[c].cases+=cd.cases||0;
      totC[c].patients+=cd.patients||0;
      totC[c].revenue+=cd.revenue||0;
      totC[c].paid+=cd.paid||0;
      totC[c].due+=cd.due||0;
      totC[c].unique_referrers+=cd.unique_referrers||0;
    });
  });
  renderKPICard(totC,branch,"YTD ("+yearSet.join(", ")+")",flatTargetsAnnual(),yearSet.length||1);

  function dsY(field){return allCentres.map((c,i)=>({label:shortName(c),stack:"s",backgroundColor:bColor(c,i),
    data:yearSet.map(yr=>{const ents=Object.entries(HISTORY).filter(([k])=>k.startsWith(yr+"-")).map(([,v])=>v);
      return Math.round(ents.reduce((s,e)=>{const cd=(e.centres||{})[c];return cd?s+(cd[field]||0):s;},0));})}));}
  function dsYRef(){return allCentres.map((c,i)=>({label:shortName(c),stack:"s",backgroundColor:bColor(c,i),
    data:yearSet.map(yr=>{let s=0;
      Object.entries(HISTORY).filter(([k])=>k.startsWith(yr+"-")).forEach(([,e])=>{const cd=(e.centres||{})[c];if(cd)s+=cd.unique_referrers||0;});
      return s;})}));}

  try{mkRevChartYearly("cRev",yearSet,dsY("revenue"),branch);}catch(ex){console.warn("cRev",ex);}
  try{mkChart("cInv","bar",yearSet,dsY("investigations"),"Investigations",true);}catch(ex){}
  try{mkChart("cPat","bar",yearSet,dsY("patients"),"Patients",true);}catch(ex){}
  try{mkChart("cRef","bar",yearSet,dsYRef(),"Unique Referrers",true);}catch(ex){}
  try{renderCaseTypeChart(Object.values(HISTORY),branch);}catch(ex){}

  const agentMap={};
  Object.values(HISTORY).forEach(e=>(e.agents||[]).forEach(a=>{
    if(!agentMap[a.agent])agentMap[a.agent]={agent:a.agent,investigations:0,cases:0,revenue:0,paid:0};
    agentMap[a.agent].investigations+=a.investigations||0;
    agentMap[a.agent].cases+=a.cases||0;
    agentMap[a.agent].revenue+=a.revenue||0;
    agentMap[a.agent].paid+=a.paid||0;
  }));
  try{renderAgentsChart(Object.values(agentMap));}catch(ex){}

  const refMap={};
  Object.values(HISTORY).forEach(e=>(e.referrers||[])
    .filter(r=>!branch||r.centre===branch)
    .forEach(r=>{const k=r.centre+"|"+r.referrer;
      if(!refMap[k])refMap[k]={...r};
      else{refMap[k].cases+=r.cases;refMap[k].investigations+=r.investigations;refMap[k].revenue+=r.revenue;}
    }));
  renderRefTable(Object.values(refMap).sort((a,b)=>b.cases-a.cases),branch);
}

(function init(){
  const keys=Object.keys(HISTORY).sort().reverse();
  if(keys.length){const[y]=keys[0].split("-");document.getElementById("yearSel").value=y;}
  document.getElementById("monthSel").value="0";
  render();
})();
</script>
</body>
</html>
